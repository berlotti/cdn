<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOV IDS-samensteller</title>
<style>
:root{
  --ink:#1B2430; --muted:#5B6573; --line:#DDE1E6; --soft:#EEF0F3; --bg:#F4F5F7; --card:#FFFFFF; --head:#F8F9FB;
  --accent:#1D4ED8; --accent-ink:#1E3A8A; --ok:#166534; --ok-bg:#F0FDF4; --ok-line:#BBF7D0;
  --warn:#7C2D12; --warn-bg:#FFF7ED; --warn-line:#FED7AA; --err:#991B1B; --err-bg:#FEF2F2; --err-line:#FECACA;
  --info:#1E3A8A; --info-bg:#EFF6FF; --info-line:#BFDBFE;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
a{color:var(--accent)}a:hover{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #93B4F5;outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:10px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;border-radius:6px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.brand b{font-size:16px;font-weight:600}
.proj{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#C9D1DB}
.proj input{background:#26313E;border:1px solid #4A5563;border-radius:6px;color:#fff;padding:5px 8px;min-width:240px;font-size:13px}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:8px;padding:0 12px;min-height:44px}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:14px;min-width:0}
.topbtns{display:flex;gap:8px}
.btn-dark{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #4A5563;background:#26313E;color:#fff;font-size:13px}
.btn-dark:hover{background:#334155}

/* layout */
.layout{display:flex;flex-wrap:wrap;align-items:flex-start}
.filters{flex:1 1 230px;max-width:260px;background:var(--card);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto}
.main{flex:999 1 560px;min-width:0;padding:20px;display:flex;flex-direction:column;gap:18px}
.basket{flex:1 1 300px;max-width:350px;background:var(--card);border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto}
@media (max-width:1100px){.filters,.basket{position:static;max-height:none;max-width:none;border:0;border-bottom:1px solid var(--line)}}

fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
legend,.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.check{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;cursor:pointer}
.check span:first-child{display:flex;align-items:center;gap:9px}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.check .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid #C3C9D1;background:#fff;font-size:13px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.small-links{display:flex;gap:12px;font-size:13px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);text-decoration:underline;font-size:13px}

.chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;border-radius:4px;padding:1px 6px;white-space:nowrap}
.c-ALG{color:#334155;background:#E2E8F0}.c-ARC{color:#1E40AF;background:#DBEAFE}.c-CON{color:#9A3412;background:#FFEDD5}.c-INS{color:#0F766E;background:#CCFBF1}.c-MJOP{color:#6B21A8;background:#F3E8FF}

/* library */
.libhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.libhead h1{margin:0;font-size:22px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cardhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--head);border-bottom:1px solid var(--line)}
.cardhead .t{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cardhead h2{margin:0;font-size:16px;font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:8px 12px}
td{padding:7px 12px;border-top:1px solid var(--soft);vertical-align:middle}
th:first-child,td:first-child{padding-left:16px}
th:last-child,td:last-child{padding-right:16px;text-align:right}
tr.on{background:#FAFCFF}
.namebtn{background:none;border:0;padding:6px 0;text-align:left;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:#C3C9D1;text-underline-offset:3px}
.namebtn:hover{text-decoration-color:var(--ink)}
.add,.added,.lock{min-height:34px;min-width:116px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap}
.add{border:1px solid #C3C9D1;background:#fff}
.add:hover{border-color:var(--ink)}
.added{border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok)}
.added:hover{border-color:var(--err-line);background:var(--err-bg);color:var(--err)}
.lock{border:1px solid var(--line);background:#F1F5F9;color:#334155;cursor:default}
.grpbtn{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:13px;font-weight:500}
.grpbtn.rm{border-color:#C3C9D1;color:var(--ink)}
.grpok{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ok);font-weight:500}
.see{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin:1px 4px 1px 0;border:1px solid var(--info-line);color:var(--info);background:#fff;white-space:nowrap}
.see.hit{background:var(--info-bg)}
.cyc{display:inline-block;font-size:12px;border:1px solid #C3C9D1;border-radius:999px;padding:1px 9px;white-space:nowrap}
.mjophead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.mjophead h2{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.comp{margin:8px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
details.cl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.cl+details.cl{margin-top:8px}
details.cl>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;cursor:pointer;background:var(--head)}
details.cl>summary::-webkit-details-marker{display:none}
details.cl[open]>summary{border-bottom:1px solid var(--line)}
details.cl>summary .t{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
details.cl>summary .car{display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
details.cl[open]>summary .car{transform:rotate(90deg)}
details.cl h3{margin:0;font-size:15px;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed #C3C9D1;border-radius:10px}

/* basket */
.bhead{display:flex;align-items:center;justify-content:space-between}
.bhead h2{margin:0;font-size:18px;font-weight:600}
.bgroup{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--soft)}
.bgroup summary{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;list-style:none;min-height:32px}
.bgroup summary::-webkit-details-marker{display:none}
.bgroup summary span:first-child{display:flex;align-items:center;gap:8px;font-weight:600}
.bitem{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0 2px 4px}
.x{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{background:var(--err-bg);color:var(--err)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;font-size:13px;overflow-wrap:anywhere}
.note ul{margin:4px 0 0;padding-left:18px}.note li{margin:2px 0}
.note svg{flex-shrink:0;margin-top:1px}
.n-err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err)}
.n-warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.n-info{background:var(--info-bg);border:1px solid var(--info-line);color:var(--info)}
.n-ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.primary{min-height:48px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:0 18px}
.primary:hover{background:#1E40AF}
.primary:disabled{background:#94A3B8;cursor:not-allowed}
.secondary{min-height:42px;border-radius:8px;border:1px solid #C3C9D1;background:#fff;font-size:14px;padding:0 14px}
.secondary:hover{border-color:var(--ink)}
.foot{font-size:12px;color:var(--muted)}

/* dialogs */
dialog{border:0;border-radius:12px;padding:0;max-width:min(1180px,96vw);width:100%;max-height:92vh;box-shadow:0 20px 60px rgba(15,23,42,.35)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg{display:flex;flex-direction:column;max-height:92vh}
.dlghead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlghead h2{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dlgbody{overflow:auto;padding:20px;display:flex;flex-wrap:wrap;gap:24px}
.dlgfoot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--head)}
.col-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col-side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
.form .wide{grid-column:1/-1}
.form input,.form textarea,.form select,.tpl select{min-height:40px;border:1px solid #C3C9D1;border-radius:6px;padding:6px 10px;font-size:14px;font-weight:400;background:#fff}
.form input[aria-invalid="true"]{border-color:var(--err);background:var(--err-bg)}
.radio{display:flex;align-items:flex-start;gap:10px;min-height:34px;font-size:14px;cursor:pointer}
.radio input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted);font-size:12px}
pre.xml{margin:0;background:#1B2430;color:#E5E9F0;border-radius:8px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.5;overflow:auto;max-height:420px;white-space:pre}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.req td{vertical-align:top}
.req td:last-child{text-align:left}
.badge{display:inline-block;font-size:12px;font-weight:500;border-radius:4px;padding:1px 7px}
.b-req{background:#1B2430;color:#fff}.b-opt{background:#E5E8EC;color:#334155}.b-pro{background:var(--err-bg);color:var(--err)}
.instr{font-size:12px;color:var(--muted);margin-top:3px;white-space:pre-line}
.section-title{margin:0;font-size:15px;font-weight:600}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
/* mandje zijbalk */
.bsum{display:inline-flex;align-items:center;gap:8px}
.bgroup>summary .car,.bsub-cl .car{display:inline-block;color:var(--muted);transition:transform .15s}
.bgroup[open]>summary .car{transform:rotate(90deg)}
.bitem{border-radius:6px}
.bitem:hover{background:#F6F7F9}
.bname{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:none;border:0;padding:4px 0;text-align:left;min-width:0;flex:1;font-size:13px;color:var(--ink)}
button.bname:hover span:first-child{text-decoration:underline}
.bsub{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.lockmini{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;color:#94A3B8}
details.bsub-cl{margin-left:4px;border-left:2px solid #E9D5FF;padding-left:8px}
details.bsub-cl>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;list-style:none;cursor:pointer}
details.bsub-cl>summary::-webkit-details-marker{display:none}
.bcode{padding-left:6px}
.bgroup .bsub-cl>summary span{font-weight:400}
/* overzicht */
#dlg-ov{max-width:min(1280px,97vw)}
.ovgroup{margin-bottom:22px}
.ovgh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ovgh h3{margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.ov{background:var(--card);border:1px solid var(--line);border-radius:8px}
details.ov+details.ov{margin-top:6px}
details.ov>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;cursor:pointer}
details.ov>summary::-webkit-details-marker{display:none}
details.ov>summary .car{color:var(--muted);width:12px;transition:transform .15s}
details.ov[open]>summary .car{transform:rotate(90deg)}
details.ov[open]>summary{border-bottom:1px solid var(--line);background:var(--head)}
.ovname{flex:1 1 220px;font-weight:600}
.ovent{font-size:12.5px;color:#334155;min-width:200px}
.ovcnt{font-size:13px;min-width:160px}
.rmbtn{min-height:34px;padding:0 12px;border-radius:6px;border:1px solid #C3C9D1;background:#fff;font-size:13px}
.rmbtn:hover{border-color:var(--err-line);background:var(--err-bg);color:var(--err)}
.ovbody{padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.ovbody h4{margin:6px 0 0;font-size:14px;font-weight:600}
.req th{white-space:nowrap}
.req td:last-child,.req th:last-child{text-align:left}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.codechip{display:inline-flex;align-items:center;gap:4px;border:1px solid #E9D5FF;background:#FAF5FF;border-radius:6px;padding:0 0 0 8px;font-size:12.5px}
.codechip .x{width:28px;height:28px}
.check input:disabled{opacity:1;cursor:not-allowed}
.ifc{display:inline-block;font-family:var(--mono);font-size:11.5px;border:1px solid #C3C9D1;border-radius:4px;padding:1px 6px;margin:1px 0;background:#fff;white-space:nowrap}
.ifc.sup{border-style:dashed;color:#475569}
.check.locked{cursor:not-allowed}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">IDS</div><b>PHOV IDS-samensteller</b></div>
  <label class="proj">Eisenpakket<input id="project" type="text" placeholder="Naam van het project"></label>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6573" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <span class="sr">Zoeken</span>
    <input id="q" type="search" placeholder="Zoek op naam, IFC-klasse, eigenschap of NL-SfB-code (bijv. 21.12, IfcDoor, FireRating)" autocomplete="off">
  </label>
  <div class="topbtns">
    <button type="button" class="btn-dark" data-act="load">Openen…</button>
    <button type="button" class="btn-dark" data-act="save">Opslaan</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<div class="layout">
  <aside class="filters" aria-label="Filters" id="filters"></aside>
  <main class="main" id="main"></main>
  <aside class="basket" aria-label="Mandje" id="basket"></aside>
</div>

<dialog id="dlg-spec" aria-labelledby="spec-title"></dialog>
<dialog id="dlg-export" aria-labelledby="exp-title"></dialog>
<dialog id="dlg-ov" aria-labelledby="ov-title"></dialog>
<div id="live" class="sr" aria-live="polite"></div>

<script>
/* IDS-export voor de PHOV IDS-samensteller. Wordt in de HTML ingebed en in Node getest. */
var IDSX = (function () {
  'use strict';

  var NS_DECL = 'xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" ' +
    'xsi:schemaLocation="http://standards.buildingsmart.org/IDS http://standards.buildingsmart.org/IDS/1.0/ids.xsd" ' +
    'xmlns:ids="http://standards.buildingsmart.org/IDS"';

  // Eisen die elke MJOP-specificatie krijgt. card: required | optional | skip
  var DEFAULT_TEMPLATE = [
    { key: 'nen', label: 'Onderhoud.NEN2767', type: 'IfcLabel', value: 'zes cijfers, zonder puntjes', card: 'required' },
    { key: 'cond', label: 'Pset_Condition.AssessmentCondition', type: 'IfcLabel', value: 'conditiescore (schaal per project afspreken)', card: 'optional' },
    { key: 'date', label: 'Pset_Condition.AssessmentDate', type: 'IfcDate', value: 'na 2000-01-01', card: 'optional' },
    { key: 'cyc', label: 'Onderhoud.Cyclus', type: 'IfcInteger', value: 'cyclus in jaren uit de MJOP (bijv. 24)', card: 'optional' },
    { key: 'mat', label: 'Materiaal', type: 'material', value: 'aanwezig', card: 'required' }
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }
  function rx(code) { return String(code).replace(/[.\\^$|?*+()[\]{}\-]/g, function (c) { return '\\' + c; }); }
  function uniq(a) { var o = []; a.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }
  function group(alts) { return alts.length === 1 ? alts[0] : '(' + alts.join('|') + ')'; }

  // Zelfde stijl als de PHOV-IDS ([0-9]{2}\.[0-9]{2}.*): de code, eventueel gevolgd door tekst ("21.12 spouwwanden")
  function codePattern(codes) { return group(uniq(codes).map(rx)) + '.*'; }
  // Hoofdstukken uit de OTL: "21" → 21.xx, "62.12" → 62.12…
  function chapterPattern(chs) {
    return group(uniq(chs).map(function (k) { return k.indexOf('.') >= 0 ? rx(k) : rx(k) + '\\.'; })) + '.*';
  }

  function prop(pset, name, dataType, card, instr, valueXml) {
    return '        <ids:property dataType="' + dataType + '" cardinality="' + card + '" instructions="' + esc(instr) + '">\n' +
      '          <ids:propertySet><ids:simpleValue>' + esc(pset) + '</ids:simpleValue></ids:propertySet>\n' +
      '          <ids:baseName><ids:simpleValue>' + esc(name) + '</ids:simpleValue></ids:baseName>\n' +
      (valueXml ? '          <ids:value>' + valueXml + '</ids:value>\n' : '') +
      '        </ids:property>\n';
  }
  function classificationXml(pattern, card, instr, indent) {
    var p = indent || '        ';
    return p + '<ids:classification' + (card ? ' cardinality="' + card + '"' : '') + (instr ? ' instructions="' + esc(instr) + '"' : '') + '>\n' +
      p + '  <ids:value><xs:restriction base="xs:string"><xs:pattern value="' + esc(pattern) + '"/></xs:restriction></ids:value>\n' +
      p + '  <ids:system><ids:simpleValue>NL-SfB</ids:simpleValue></ids:system>\n' +
      p + '</ids:classification>\n';
  }
  function cards(tpl) { var c = {}; (tpl || DEFAULT_TEMPLATE).forEach(function (t) { c[t.key] = t.card; }); return c; }
  function hasMaterial(d) { return d.entity && d.entity.toUpperCase() !== 'IFCSYSTEM'; }

  var CLASS_INSTR = 'Classificeer het object met een NL-SfB-code die volgens de ILS-woco OTL bij deze IFC-klasse hoort.';

  function mjopSpecXml(d, tpl, ifcVersion) {
    var c = cards(tpl), appl = '', req = '';
    if (d.entity) appl += '        <ids:entity><ids:name><ids:simpleValue>' + esc(d.entity.toUpperCase()) + '</ids:simpleValue></ids:name></ids:entity>\n';
    if (d.kind === 'class') {
      req += classificationXml(chapterPattern(d.chapters), 'required', CLASS_INSTR);
    } else {
      appl += classificationXml(codePattern(d.codes));
      if (c.nen !== 'skip') req += prop('Onderhoud', 'NEN2767', 'IFCLABEL', c.nen,
        "De zogenaamde 'zes cijferige NlSfb code' uit de NEN 2767 (zonder puntjes)",

/* ------------------------------------------------------------ controles */
function mjopDescs() { return IDSX.mjopDescriptors(DATA, S.basket.mjop, { granularity: S.exp.granularity, classReq: S.exp.classReq }); }
function ifcChips(x) {
  if (!x.ifc || !x.ifc.length) return '<span class="badge" style="background:#F1F5F9;color:#475569" title="De ILS-woco OTL koppelt deze NL-SfB-code niet aan een IFC-klasse">geen IFC-klasse</span>';
  return x.ifc.map(function (m) {
    var sup = m.src === 'aanvulling';
    return '<span class="ifc' + (sup ? ' sup' : '') + '" title="' + h(sup ? 'Aanvulling op de OTL (B Things), ter controle' : 'OTL: ' + m.via.join(', ')) + '">' + h(m.e) + (sup ? '*' : '') + '</span>';

}

  var out = [];

  var ids = {}, dups = [];
  DATA.groups.forEach(function (g) { g.specs.forEach(function (s) { if (inSpecs(s.id) && s.identifier) { if (ids[s.identifier]) dups.push(s.identifier); ids[s.identifier] = 1; } }); });
  mjopDescs().forEach(function (d) { if (ids[d.id]) dups.push(d.id); ids[d.id] = 1; });
  if (dups.length) out.push({ lvl: 'err', title: 'Dubbele identifiers', text: dups.join(', ') });
  // MJOP-code in meer dan één gekozen cluster
  var seen = {}, twice = [];
  S.basket.mjop.forEach(function (k) { var c = k.split('|')[1]; if (seen[c] && twice.indexOf(c) < 0) twice.push(c); seen[c] = 1; });
  if (twice.length && S.exp.granularity === 'cluster') out.push({ lvl: 'warn', title: 'Code in meerdere clusters gekozen', text: 'NL-SfB ' + twice.join(', ') + ' zit in twee gekozen elementclusters. Objecten met die code worden door beide specificaties getoetst.' });
  // MJOP-codes zonder IFC-klasse / via aanvulling

  S.basket.mjop.forEach(function (k) { var p = k.split('|'), x = CL[p[0]].codes.filter(function (y) { return y.code === p[1]; })[0]; if (!x) return; if (!x.ifc.length) noIfc.push(x.code); else if (x.ifc[0].src === 'aanvulling') sup.push(x.code); });
  if (noIfc.length) out.push({ lvl: 'warn', title: plural(noIfc.length, 'MJOP-code', 'MJOP-codes') + ' zonder IFC-klasse', text: 'De OTL koppelt ' + noIfc.slice(0, 8).join(', ') + (noIfc.length > 8 ? ' …' : '') + ' niet aan een IFC-klasse. Die specificatie filtert alleen op classificatie, dus ontbrekende classificaties vallen daar niet op.' });
  if (sup.length) out.push({ lvl: 'info', title: plural(sup.length, 'MJOP-code', 'MJOP-codes') + ' via aanvulling op de OTL', text: 'Voor NL-SfB-hoofdstukken die niet in de OTL staan (bijv. 13, 16, 42–44, 51, 54, 58, 81–86) is een IFC-klasse aangevuld. Gemarkeerd met *; graag controleren.' });
  // aandachtspunten uit de bron
  DATA.groups.forEach(function (g) { g.specs.forEach(function (s) { if (inSpecs(s.id)) s.notes.forEach(function (n) { out.push({ lvl: 'warn', title: g.code + ' · ' + s.name, text: n }); }); }); });
  // overlap

  S.basket.mjop.forEach(function (k) { var p = k.split('|'); var x = CL[p[0]].codes.filter(function (y) { return y.code === p[1]; })[0]; if (x && x.see.some(function (l) { return BYNAME[l] && inSpecs(BYNAME[l]); })) ov++; });
  if (ov) out.push({ lvl: 'info', title: plural(ov, 'MJOP-code overlapt', 'MJOP-codes overlappen') + ' met een IDS-specificatie in je mandje', text: 'Beide worden getoetst; meestal geen actie nodig.' });
  // correcties

  if (fx) out.push({ lvl: 'ok', title: plural(fx, 'correctie', 'correcties') + ' t.o.v. de bron-IDS al verwerkt', text: 'Zie het detail van de specificaties met het label "gecorrigeerd".' });
  return out;
}

  else if (t.getAttribute('data-exp') === 'classReq') { S.exp.classReq = t.checked; persist(); renderBasket(); renderExport('[data-exp="classReq"]'); }
  else if (t.getAttribute('data-exp') === 'split') { S.exp.split = t.value === '1'; persist(); renderExport('[data-exp="split"][value="' + t.value + '"]'); }
  else if (t.id === 'file') {
    var file = t.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var o = JSON.parse(rd.result);
        if (o.app !== 'phov-ids-samensteller' || !o.basket) throw new Error('Geen mandje-bestand van deze tool');
        var keepF = S.filters, keepOpen = S.open;
        S = merge(freshState(), o); S.filters = keepF; S.open = keepOpen;
        document.getElementById('project').value = S.project; renderAll(); say('Mandje geopend');
      } catch (err) { window.alert('Dit bestand kon niet worden geopend: ' + err.message); }
      t.value = '';
    };
    rd.readAsText(file);
  }
});
var tmr = null;
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') { clearTimeout(tmr); tmr = setTimeout(function () { Q = t.value; renderMain(); }, 140); }
  else if (t.id === 'project') { S.project = t.value; persist(); }
  else if (t.hasAttribute('data-info')) {
    S.exp.info[t.getAttribute('data-info')] = t.value; persist();
    clearTimeout(tmr); tmr = setTimeout(function () { renderExport('[data-info="' + t.getAttribute('data-info') + '"]'); }, 350);
  } else if (t.getAttribute('data-exp') === 'filename') {
    S.exp.filename = t.value; persist();
    clearTimeout(tmr); tmr = setTimeout(function () { renderExport('[data-exp="filename"]'); }, 350);
  }
});
document.addEventListener('click', function (e) {
  var sm2 = e.target.closest('details[data-bkey] > summary, details[data-ov] > summary');
  if (!sm2 || e.target.closest('[data-act]')) return;
  var dd = sm2.parentNode, now = !dd.open;
  if (dd.hasAttribute('data-bkey')) BOPEN[dd.getAttribute('data-bkey')] = now; else OVOPEN[dd.getAttribute('data-ov')] = now;
});
document.addEventListener('click', function (e) {
  var sm = e.target.closest('details.cl > summary');
  if (!sm || e.target.closest('[data-act]')) return;
  var d = sm.parentNode, ec = d.getAttribute('data-ec'), i = S.open.indexOf(ec);
  if (!d.open && i < 0) S.open.push(ec);
  if (d.open && i >= 0) S.open.splice(i, 1);
  persist();
});
document.getElementById('dlg-spec').addEventListener('click', function (e) { if (e.target === e.currentTarget) e.currentTarget.close(); });

document.getElementById('project').value = S.project;
renderAll();
</script>
</body>
</html>
